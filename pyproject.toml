[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-memory"
version = "0.1.0"
description = "A local, Git-friendly technical experience memory for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Forge contributors"}]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

